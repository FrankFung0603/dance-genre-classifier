# 統一入口：80 → frontend(Next.js) / backend(FastAPI)
# WebSocket upgrade：/ws/*（預測 + pose + 控制訊息）
worker_processes auto;

events {
    worker_connections 1024;
}

http {
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ""      close;
    }

    upstream frontend {
        server frontend:3000;
    }

    upstream backend {
        server backend:8000;
    }

    server {
        listen 80;

        # 後端 API + WebSocket（前端 same-origin 呼叫，nginx 反代）
        location ~ ^/(session|feedback|healthz|ws)(/|$) {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 1h;   # WS 長連線（session = 連線生命週期）
            proxy_send_timeout 1h;
        }

        # 其餘全走前端
        location / {
            proxy_pass http://frontend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Upgrade $http_upgrade;           # Next.js HMR（prod 無害）
            proxy_set_header Connection $connection_upgrade;
        }
    }
}
